name: API foundation tests

on:
  push:
    branches:
      - multi-shop-foundation
  pull_request:
    branches:
      - main
      - multi-shop-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install isolated API test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run API and tenant-auth contract tests
        run: python -m pytest -q tests/test_api_foundation.py tests/test_tenant_auth_contract.py tests/test_api_auth_routes.py
